<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ROM-Sync</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<header id="top">
  <nav>
    <button class="nav active" data-view="library">Library</button>
    <button class="nav" data-view="devices">Devices</button>
    <button class="nav" data-view="sysfiles">System files</button>
  </nav>
  <div id="search-wrap">
    <input id="search" type="search" placeholder='Search title, tag, genre, system…  operators: year>1995  size<1gb  rating>80  system:snes  genre:rpg  franchise:mario  theme:fantasy  region:usa  tag:…' autocomplete="off" spellcheck="false">
    <span id="count"></span>
  </div>
  <div id="device-pick">
    <label>Selecting for</label>
    <select id="device-select"><option value="">— no device —</option></select>
  </div>
  <button class="nav cog" data-view="settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>
</header>

<main>
  <!-- ------------------------------------------------ Library -->
  <section id="view-library" class="view active">
    <aside id="filters">
      <div class="chips" id="active-chips"></div>
      <div class="facet"><h4>Smart lists</h4>
        <button class="smart" data-q="rating>85 votes>50">Top rated</button>
        <button class="smart" data-q="year>2010">Modern</button>
        <button class="smart" data-q="year<1995">Retro</button>
        <button class="smart" data-q="size>1gb">Big games</button>
        <button class="smart" data-q="genre:rpg">RPGs</button>
        <button class="smart" data-q="genre:platform">Platformers</button>
      </div>
      <div class="facet range"><h4>Rating at least <span id="rating-val">any</span></h4>
        <input type="range" id="rating-min" min="0" max="100" value="0">
      </div>
      <div class="facet" data-facet="system"><h4>System <button class="clear" data-clear="system">clear</button></h4><div class="facet-body"></div></div>
      <div class="facet" data-facet="genre"><h4>Genre <button class="clear" data-clear="genre">clear</button></h4><div class="facet-body"></div></div>
      <div class="facet" data-facet="franchise"><h4>Franchise <button class="clear" data-clear="franchise">clear</button></h4><div class="facet-body"></div></div>
      <div class="facet" data-facet="theme"><h4>Theme <button class="clear" data-clear="theme">clear</button></h4><div class="facet-body"></div></div>
      <div class="facet" data-facet="mode"><h4>Players <button class="clear" data-clear="mode">clear</button></h4><div class="facet-body"></div></div>
      <div class="facet" data-facet="perspective"><h4>Perspective <button class="clear" data-clear="perspective">clear</button></h4><div class="facet-body"></div></div>
      <div class="facet" data-facet="tag"><h4>Other tags <button class="clear" data-clear="tag">clear</button></h4><div class="facet-body"></div></div>
      <div class="facet" data-facet="decade"><h4>Decade <button class="clear" data-clear="decade">clear</button></h4><div class="facet-body"></div></div>
      <div class="facet" data-facet="region"><h4>Region <button class="clear" data-clear="region">clear</button></h4><div class="facet-body"></div></div>
      <div class="facet range"><h4>Size</h4>
        <div class="slider2"><input type="range" id="size-lo" min="0" max="1000" value="0"><input type="range" id="size-hi" min="0" max="1000" value="1000"></div>
        <div class="exact"><input id="size-min" placeholder="min e.g. 10mb"><span>–</span><input id="size-max" placeholder="max e.g. 2gb"></div>
      </div>
      <div class="facet range"><h4>Year</h4>
        <div class="slider2"><input type="range" id="year-lo" min="1975" max="2026" value="1975"><input type="range" id="year-hi" min="1975" max="2026" value="2026"></div>
        <div class="exact"><input id="year-min" placeholder="from"><span>–</span><input id="year-max" placeholder="to"></div>
      </div>
      <div class="facet"><h4>Other</h4>
        <label class="row"><input type="checkbox" id="f-matched"> has cover &amp; details</label>
        <label class="row"><input type="checkbox" id="f-selected"> in selection for this device</label>
        <label class="row"><input type="checkbox" id="f-ondevice"> on this device now</label>
        <label class="row"><input type="checkbox" id="f-folder"> multi-file games only</label>
      </div>
    </aside>
    <div id="library-main">
      <div id="toolbar">
        <label>Sort <select id="sort">
          <option value="title">Title</option><option value="year">Year</option><option value="rating">Rating</option>
          <option value="size">Size</option><option value="system">System</option><option value="mtime">Recently added</option>
        </select></label>
        <label>Tiles <input type="range" id="tile" min="90" max="260" value="150"></label>
        <button id="view-grid" class="active">Grid</button><button id="view-list">List</button>
        <span class="spacer"></span>
        <span id="sel-summary"></span>
        <span id="cap-meter" class="hidden"></span>
      </div>
      <div id="grid"></div>
    </div>
    <aside id="detail" class="hidden"></aside>
  </section>

  <!-- ------------------------------------------------ Devices -->
  <section id="view-devices" class="view">
    <div class="page">
      <h2>Devices <button id="refresh-devices">Refresh</button> <span id="probe-note" class="muted"></span></h2>
      <div id="device-list" class="cards"></div>
    </div>
  </section>

  <!-- ------------------------------------------------ Device -->
  <section id="view-device" class="view">
    <div class="page" id="device-page"></div>
  </section>

  <!-- ------------------------------------------------ System files -->
  <section id="view-sysfiles" class="view">
    <div class="page" id="sysfiles-page"></div>
  </section>

  <!-- ------------------------------------------------ Settings -->
  <section id="view-settings" class="view">
    <div class="page" id="settings-page"></div>
  </section>
</main>

<div id="modal" class="hidden"><div id="modal-box"></div></div>
<div id="toast" class="hidden"></div>
<script src="/ui/app.js"></script>
</body>
</html>
