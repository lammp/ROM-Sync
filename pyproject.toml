[project]
name = "romsync"
version = "2.0.0.dev0"
description = "Curate a game library onto a handheld. One engine, two interfaces."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=9.0",
  "pytest-xdist>=3.6",
  "pytest-randomly>=3.15",
  "pytest-cov>=5.0",
  "httpx2>=2.0",
]
# The frozen release artefact (F13-S1); only the release build needs it.
build = [
  "pyinstaller>=6.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "engine"}

[tool.setuptools.packages.find]
where = ["engine"]

[tool.ruff]
line-length = 96
target-version = "py312"
src = ["engine", "api", "desktop", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Corpora are tables: one row per line, however long the title.
# They also hold the characters they test, ambiguous quotation marks included.
"tests/fixtures/*.py" = ["E501", "RUF001"]
# Goldens are generated tables, one fact per line.
"tests/golden/data/*.py" = ["E501"]
# The franchise rules are a table, one rule per line.
"engine/romsync/app/franchise_rules.py" = ["E501"]
# PowerShell and C# embedded as constants, kept as their own languages are written.
"engine/romsync/adapters/dest_mtp/scripts.py" = ["E501"]
# The Inno Setup script embedded as a constant, kept as Inno and Pascal are written.
"tools/installer.py" = ["E501"]
# The system-files registry is a table, one requirement per line.
"engine/romsync/app/sysfiles_registry.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["romsync", "romsync_api", "romsync_desktop", "tools", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["engine", "api", "desktop", "tools"]
warn_unreachable = true
disallow_any_explicit = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# A test that hangs fails, with every thread's traceback, instead of holding
# the run until the CI runner gives up and reports nothing.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true
pythonpath = ["engine", "api", "desktop", "."]
markers = [
  "device: needs a real device; never part of the gate",
]

[tool.coverage.run]
branch = true
source = ["engine/romsync", "api/romsync_api", "desktop/romsync_desktop"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover  #",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]
