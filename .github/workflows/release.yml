# A version tag builds and publishes a release (F13-S7).
#
# Windows, as the gate. The gate runs first and must pass; then the interface
# is built, the application frozen, the installer compiled, a portable zip
# made, every artefact checksummed, and the installer installed, self-tested,
# started and uninstalled on the runner before anything is published. The release is created with the
# artefacts, their SHA-256 sums, and notes generated from the merged work.
# No step needs a secret beyond the run's own token, and nothing is signed.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything that runs third-party code, with a read-only token that is not
  # kept in the checkout (F16-S5).
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      # the tag reaches the shell only as a variable, never pasted into a script
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the development and build toolchains
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,build]"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the interface toolchain
        run: npm ci --prefix ui
      - name: Install the browser
        run: npx --prefix ui playwright install chromium
      - name: Verify
        run: python tools/verify.py
      - name: Build the interface
        run: npm run bundle --prefix ui
      - name: Freeze the application
        run: python tools/installer.py build
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile the installer
        run: python tools/installer.py installer --version "$env:TAG"
      - name: Package and checksum
        run: python tools/installer.py package --version "$env:TAG"
      - name: Install, self-test, start and uninstall
        run: python tools/smoke_install.py
      - name: Keep the artefacts for the publishing job
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: reports/release/artefacts/
          if-no-files-found: error

  # The only step that can write to the repository: no checkout, no install.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: artefacts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "$TAG"
          artefacts/*
          --title "ROM-Sync $TAG"
          --generate-notes
          --verify-tag
