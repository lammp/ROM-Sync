# Every push to v2 builds the installer and proves it on a fresh Windows runner (F13-S9).
#
# The gate proves the code; this proves the artefact. The application is
# frozen, the installer compiled, and the installed application self-tested
# with no Python on its PATH, started as its shortcut starts it, and
# uninstalled with its data kept. The installer and the portable zip are kept
# as the run's artefacts for 14 days, to download and try. Nothing is
# published and nothing is written to the repository.
name: installer

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the build toolchain
        run: python -m pip install --upgrade pip && python -m pip install -e ".[build]"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the interface toolchain
        run: npm ci --prefix ui
      - name: Build the interface
        run: npm run bundle --prefix ui
      - name: Freeze the application
        run: python tools/installer.py build
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile the installer
        run: python tools/installer.py installer
      - name: Package and checksum
        run: python tools/installer.py package
      - name: Install, self-test, start and uninstall
        run: python tools/smoke_install.py
      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: ROM-Sync-installer-${{ github.sha }}
          path: reports/release/artefacts/
          retention-days: 14
          if-no-files-found: error
      - name: Keep the install log and self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ github.sha }}
          path: |
            reports/release/install.log
            reports/release/self-test.json
            reports/release/ROM-Sync.iss
          retention-days: 14
          if-no-files-found: ignore
