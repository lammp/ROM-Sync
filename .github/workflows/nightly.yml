# The nightly finds what a fixed seed and a warm lockfile hide: order
# dependence between tests, and a dependency that moved under us. It opens an
# issue rather than failing quietly, because nobody is watching at 03:00.
name: nightly

on:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  nightly:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the development toolchain, resolved fresh
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" --upgrade
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the interface toolchain, resolved fresh
        run: npm install --no-package-lock --prefix ui
      - name: Verify
        run: python tools/verify.py
      - name: Random test order
        run: python -m pytest tests -p randomly -q
      - uses: actions/github-script@v7
        if: failure()
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `nightly failed on ${new Date().toISOString().slice(0, 10)}`,
              body: `The nightly run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nEither a test depends on order, or a dependency moved.`,
              labels: ['nightly'],
            })