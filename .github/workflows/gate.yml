# One workflow, one job, one step that matters.
#
# Windows, because the application is Windows only and because the path rules
# the gate enforces are Windows rules. Nothing here reimplements a stage: if
# this file can fail where a clean local run passed, the gate is wrong, and
# that is the defect to fix.
name: gate

on:
  pull_request:
    branches: [v2, main]
  push:
    branches: [v2]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The parity captures read version 1 from its tag.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the development toolchain
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the interface toolchain
        run: npm ci --prefix ui
      - name: Verify
        run: python tools/verify.py